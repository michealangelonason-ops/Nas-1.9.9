body{max-width:560px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 150px)}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.pv em{margin-top:auto;height:12px;width:55%;border-radius:7px;background:var(--ac)}
.card h3{font-size:13px;font-weight:500;margin:10px 2px 2px}
.rar{font-size:12px;font-weight:600;color:var(--rc);margin:0 2px 8px;text-transform:capitalize}
.lockc .pv{opacity:.35;filter:grayscale(1)}

.pan{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:14px}.pan h3{font-size:14px;margin-bottom:12px}
.hb{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:8px}.hb span{width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb .bar{flex:1}.hb em{font-style:normal;color:var(--mute);width:30px;text-align:right}
.stk{display:flex;height:14px;border-radius:9px;overflow:hidden}.stk i{display:block}
.cr{width:104px}.crate{width:100%;display:block;overflow:visible}
.case[data-t=rare]{box-shadow:0 0 18px -6px var(--cc)}.case[data-t=epic]{box-shadow:0 0 26px -4px var(--cc);animation:cpl 2.6s ease-in-out infinite}.case[data-t=legendary]{box-shadow:0 0 34px -2px var(--cc)}
@keyframes cpl{50%{box-shadow:0 0 38px -2px var(--cc)}}
.case[data-t=rare] .cr{filter:drop-shadow(0 0 7px var(--cc))}.case[data-t=epic] .cr{filter:drop-shadow(0 0 12px var(--cc))}.case[data-t=legendary] .cr{filter:drop-shadow(0 0 18px var(--cc))}
.case[data-t=legendary]::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,220,130,.3) 50%,transparent 60%);background-size:250% 100%;animation:sheen 3.5s linear infinite;pointer-events:none}
.tier{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--cc);color:#111;text-transform:capitalize;margin-bottom:5px}
.crate .rays,.crate .spk{transform-box:fill-box;transform-origin:center}.crate .rays{animation:spin 10s linear infinite}.crate .spk{animation:tw 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes tw{50%{transform:scale(1.5) rotate(20deg);opacity:.5}}
.reveal>*{position:relative;z-index:1}
.reveal[data-r=epic]::before,.reveal[data-r=legendary]::before{content:"";position:absolute;inset:-70%;background:repeating-conic-gradient(var(--rc) 0 8deg,transparent 8deg 24deg);opacity:.25;animation:spin 9s linear infinite}
.tdots{display:flex;gap:6px;justify-content:center;margin-top:14px}.tdots i{width:8px;height:8px;border-radius:50%;background:var(--ln);transition:width .2s}.tdots i.on{background:var(--ac);width:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

document.getElementById('sk').textContent=SK.map(k=>`[data-skin=${k[0]}]{--bg:${k[3]};--sf:${k[4]};--ink:${k[5]};--ac:${k[6]};--on:${lum(k[6])>.35?'#111':'#fff'}}`).join('');
const KEY='nas-v1';let mem=null;
const load=()=>{let s=null;try{const v=localStorage.getItem(KEY)||localStorage.getItem('kindle-v1');if(v)s=JSON.parse(v)}catch(e){}s=s||mem||{habits:[],coins:150,owned:['paper'],skin:'paper',seq:1};s.cd=s.cd||{};if(s.snd===undefined)s.snd=1;return s};
let S=load();
const save=()=>{mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const day=n=>{const d=new Date();d.setDate(d.getDate()-n);return dk(d)};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const streak=h=>{let n=0,i=h.log[day(0)]?0:1;while(h.log[day(i)]){n++;i++}return n};
const cdk=h=>Math.max(h.last||0,S.cd[h.name.toLowerCase()]||0);
const left=h=>Math.min(18e6,cdk(h)+18e6-Date.now());
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1e3)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h+':'+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const pool=c=>SK.filter(k=>c.id=='vault'?(k[2]=='epic'||k[2]=='legendary'):k[7]==c.id);
const $=id=>document.getElementById(id);
let lastSkin=null,tab='today',editing=null,emo=EMO[0],armed=false,busy=false;
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1700)}
function bump(){const c=$('coins');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}
function render(){
 const sk=SK.find(k=>k[0]==S.skin)||SK[0];
 document.documentElement.dataset.skin=sk[0];document.documentElement.dataset.r=sk[2];document.querySelector('meta[name=theme-color]').content=sk[3][0]=='#'?sk[3]:sk[4];
 $('coins').textContent='🪙 '+S.coins;$('snd').textContent=['🔇','🔊','🎵'][S.snd||0];if(lastSkin!=S.skin){lastSkin=S.skin;music()}
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t==tab));
 $('add').style.display=tab=='today'?'':'none';
 $('main').innerHTML=tab=='today'?today():tab=='cases'?cases():tab=='skins'?skins():stats();
}
function today(){
 const H=S.habits,total=H.reduce((a,h)=>a+Object.values(h.log).reduce((x,y)=>x+y,0),0),d=H.filter(h=>left(h)>0).length,p=H.length?Math.round(d/H.length*100):0,now=new Date().toTimeString().slice(0,5);
 let o=`<div class="hero"><div class="ring" style="--p:${p}"><b>${p}%</b></div><div><h2>${H.length?(d==H.length?'Everything done':d+' of '+H.length+' done'):'Nothing yet'}</h2><p>${H.length?total+' check-ins so far. 100 coins each, then a 5-hour lock.':'Add a habit you don’t want to forget.'}</p></div></div>`;
 if(!H.length)return o+'<div class="empty">Tap “New habit” to add your first one.</div>';
 return o+H.map(h=>{const l=left(h),lk=l>0,late=!lk&&h.time&&now>=h.time,s=streak(h);
 const dots=[6,5,4,3,2,1,0].map(i=>`<i class="${h.log[day(i)]?'on':''}"></i>`).join('');
 return `<div class="habit ${lk?'lock':''}"><button class="chk" ${lk?'aria-disabled="true"':`data-c="${h.id}"`} aria-label="${lk?'Locked':'Complete'} ${esc(h.name)}">${lk?'✓':h.emo}</button><div class="info"><div class="nm">${esc(h.name)}</div><div class="meta">${lk?`<span class="tm" data-t="${Date.now()+l}">⏳ Ready in ${fmt(l)}</span>`:h.time?`<span class="${late?'late':''}">${late?'Due since ':''}${h.time}</span>`:'<span>Ready</span>'}<span>🔥 ${s}</span><span class="dots">${dots}</span></div></div><button class="edit" data-e="${h.id}" aria-label="Edit ${esc(h.name)}">✎</button></div>`}).join('');
}
function cases(){
 return `<div class="pity"><p>Epic or better guaranteed within ${15-(S.pity||0)} opens</p><div class="bar"><i style="width:${Math.min(100,(S.pity||0)/15*100)}%"></i></div></div><div class="cg">`+CASES.map(c=>{const pl=pool(c),own=pl.filter(k=>S.owned.includes(k[0])).length,w=TW[c.t];
 return `<div class="case" data-t="${c.t}" style="--cc:${c.c}"><div class="cr">${crate(c)}</div><div class="ci"><span class="tier">${c.t} case</span><h3>${c.n}</h3><div class="sws">${pl.map(k=>`<i class="sw" data-skin="${k[0]}"></i>`).join('')}</div><p>${own} of ${pl.length} owned</p><p>Epic or better ${(w.epic||0)+w.legendary}%. Legendary ${w.legendary}%.</p></div><button class="buy" data-o="${c.id}" ${S.coins<c.p||busy?'disabled':''}>🪙 ${c.p}</button></div>`}).join('')+'</div>';
}
function skins(){
 return `<p class="cnt">${S.owned.length} of ${SK.length} collected</p><div class="grid">`+SK.map(k=>{const own=S.owned.includes(k[0]);
 return own?`<div class="card" data-r="${k[2]}"><div class="pv" data-skin="${k[0]}">${PV}</div><h3>${k[1]}</h3><p class="rar">${k[2]}</p><button class="buy ${S.skin==k[0]?'eq':''}" ${S.skin==k[0]?'disabled':`data-q="${k[0]}"`}>${S.skin==k[0]?'Equipped':'Equip'}</button></div>`
 :`<div class="card lockc" data-r="${k[2]}"><div class="pv">${PV}</div><h3>Locked</h3><p class="rar">${k[2]}</p></div>`}).join('')+'</div><div class="row" style="margin-top:20px"><button data-x>Export backup</button><button data-i>Import backup</button></div><input type="file" id="imp" accept="application/json" hidden>';
}
$('main').addEventListener('click',e=>{
 const c=e.target.closest('[data-c]'),ed=e.target.closest('[data-e]'),o=e.target.closest('[data-o]'),q=e.target.closest('[data-q]');
 if(c){const h=S.habits.find(x=>x.id==c.dataset.c);if(left(h)>0)return;
  h.last=Date.now();S.cd[h.name.toLowerCase()]=h.last;h.log[day(0)]=(h.log[day(0)]||0)+1;S.coins+=100;save();render();bump();navigator.vibrate&&navigator.vibrate(40);toast('+100 coins');sfx('coin')}
 if(ed)openDlg(S.habits.find(x=>x.id==ed.dataset.e));
 if(o)openCase(o.dataset.o);
 if(q){S.skin=q.dataset.q;save();render()}
 if(e.target.closest('[data-x]'))exportData();if(e.target.closest('[data-i]'))$('imp').click();
});
document.querySelector('nav').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;render()}};
const PV='<span></span><u></u><u></u><em></em>';
const TIERS={common:['#9b7653','#6b4f33','#3d2c1c','#c9a27a'],uncommon:['#c98a4b','#8a5524','#5c3714','#f0b878'],rare:['#6f93b8','#3a5878','#22384f','#9fd0ff'],epic:['#8a4ad6','#4a1f86','#2a1052','#e0b5ff'],legendary:['#f2c744','#b8860b','#7a5600','#fff4b8']};
function crate(c,big){const T=TIERS[c.t],id='g'+c.id+(big?'b':'');
 const rays=c.t=='legendary'?'<g class="rays">'+Array.from({length:8},(_,i)=>`<path d="M60 56L${(60+70*Math.cos(i*.785-.13)).toFixed(1)} ${(56+70*Math.sin(i*.785-.13)).toFixed(1)}L${(60+70*Math.cos(i*.785+.13)).toFixed(1)} ${(56+70*Math.sin(i*.785+.13)).toFixed(1)}Z" fill="#ffd23f" opacity=".35"/>`).join('')+'</g>':'';
 return `<svg viewBox="0 0 120 110" class="crate ${c.t}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${T[0]}"/><stop offset="1" stop-color="${T[1]}"/></linearGradient></defs>${rays}<ellipse cx="60" cy="102" rx="42" ry="6" fill="#000" opacity=".3"/><rect x="18" y="46" width="84" height="52" rx="8" fill="url(#${id})" stroke="${T[2]}" stroke-width="3"/><rect x="14" y="30" width="92" height="22" rx="8" fill="url(#${id})" stroke="${T[2]}" stroke-width="3"/><rect x="30" y="30" width="10" height="68" fill="${T[3]}" opacity=".55"/><rect x="80" y="30" width="10" height="68" fill="${T[3]}" opacity=".55"/>${c.t=='common'?'<path d="M18 62h84M18 80h84" stroke="#3d2c1c" stroke-opacity=".5"/>':`<circle cx="35" cy="40" r="2.5" fill="${T[3]}"/><circle cx="85" cy="40" r="2.5" fill="${T[3]}"/>`}${c.t=='epic'||c.t=='legendary'?`<path class="spk" d="M60 8l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="${T[3]}"/>`:''}<rect x="48" y="48" width="24" height="24" rx="6" fill="${T[2]}" stroke="${T[3]}" stroke-width="2"/><text x="60" y="66" text-anchor="middle" font-size="16">${c.e}</text></svg>`}
const TUT=[['📝','Add your habits','Tap “New habit”, pick a name, an icon, and an optional reminder time. Edit or delete any habit with the pencil.'],['✅','Check in, earn 100','Tap the circle when you finish a habit. You get 100 coins, then it locks for 5 hours so it can’t be spammed.'],['🎁','Open cases','Higher-tier cases cost more but have better odds. An epic or better skin is guaranteed within 15 opens.'],['🎨','Equip skins','Every skin restyles the whole app. Equip them in Skins. The speaker button switches sound and music.'],['📲','Make it an app','Host the folder on a free HTTPS link, open it on your phone, then tap Install (Android) or Share, Add to Home Screen (iPhone). Export backups from Skins.']];
let ti=0;
function showTut(){const t=TUT[ti];$('tb').innerHTML=`<div style="font-size:56px">${t[0]}</div><h2 style="font-size:18px;margin:8px 0">${t[1]}</h2><p style="color:var(--mute)">${t[2]}</p>`;$('td').innerHTML=TUT.map((_,i)=>`<i class="${i==ti?'on':''}"></i>`).join('');$('tp').style.visibility=ti?'':'hidden';$('tn').textContent=ti==TUT.length-1?'Got it':'Next'}
function openTut(){ti=0;showTut();$('tut').showModal()}
let AC=null,mt=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,t0,d,ty,g,sl){const c=ac();if(!c)return;const T=c.currentTime+t0,o=c.createOscillator(),v=c.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,T);if(sl)o.frequency.exponentialRampToValueAtTime(sl,T+d);v.gain.setValueAtTime(.0001,T);v.gain.linearRampToValueAtTime(g||.12,T+.01);v.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(v);v.connect(c.destination);o.start(T);o.stop(T+d+.05)}
const NT=n=>440*Math.pow(2,n/12);
function sfx(k,r){if(!(S.snd>0))return;
 if(k=='coin'){tone(NT(7),0,.12,'square',.06);tone(NT(14),.09,.25,'square',.06)}
 if(k=='tick')tone(900,0,.03,'triangle',.05);
 if(k=='shake')tone(110,0,.8,'sawtooth',.05,60);
 if(k=='dup')tone(NT(-5),0,.25,'sine',.08);
 if(k=='win'){const n={common:[0],uncommon:[0,4],rare:[0,4,7],epic:[0,4,7,12,16],legendary:[0,4,7,12,16,19,24,28]}[r];n.forEach((x,i)=>tone(NT(x),i*.09,.5+i*.05,r=='legendary'?'triangle':'sine',.1));if(r=='legendary')tone(NT(36),.6,1.4,'sine',.05)}}
function music(){clearInterval(mt);mt=null;if(S.snd!=2)return;const idx=Math.max(0,SK.findIndex(k=>k[0]==S.skin)),root=[-12,-10,-9,-7,-5,-3,-2][idx%7],P=[[0,3,7],[-4,0,3],[-9,-5,0],[-2,2,5]];let i=0;
 const step=()=>{if(document.hidden||!AC||AC.state!='running')return;const ch=P[i++%4];ch.forEach(n=>tone(NT(root+n),0,4.2,'sine',.035));tone(NT(root+ch[Math.floor(Math.random()*3)]+24),1.2,1.6,'triangle',.03);tone(NT(root+ch[Math.floor(Math.random()*3)]+19),2.6,1.4,'triangle',.025)};ac();step();mt=setInterval(step,4000)}
function stats(){
 const H=S.habits,tot=h=>Object.values(h.log).reduce((a,b)=>a+b,0),total=H.reduce((a,h)=>a+tot(h),0),best=Math.max(0,...H.map(streak));
 const days=Array.from({length:14},(_,i)=>{const k=day(13-i);return{n:H.reduce((a,h)=>a+(h.log[k]||0),0),d:new Date(k+'T00:00').toLocaleDateString(undefined,{weekday:'narrow'})}}),mx=Math.max(1,...days.map(x=>x.n));
 const bars=days.map((x,i)=>{const h=Math.round(x.n/mx*80);return `<rect x="${i*24+4}" y="${100-h}" width="16" height="${h||4}" rx="5" style="fill:var(--ac);opacity:${x.n?1:.25}" ${h?'':'transform="translate(0 -4)"'}/><text x="${i*24+12}" y="118" text-anchor="middle" font-size="10" style="fill:var(--mute)">${x.d}</text>`+(x.n?`<text x="${i*24+12}" y="${95-h}" text-anchor="middle" font-size="10" style="fill:var(--ink)">${x.n}</text>`:'')}).join('');
 const RR=['common','uncommon','rare','epic','legendary'],RC={common:'#9aa3b2',uncommon:'#5fcf6b',rare:'#4aa8ff',epic:'#b86bff',legendary:'#ffb52e'},own=S.owned.map(id=>SK.find(k=>k[0]==id)).filter(Boolean);
 const stk=RR.map(r=>`<i style="flex:${own.filter(k=>k[2]==r).length};background:${RC[r]}"></i>`).join('');
 const hb=H.map(h=>{const n=[0,1,2,3,4,5,6].filter(i=>h.log[day(i)]).length;return `<div class="hb"><span>${esc(h.name)}</span><div class="bar"><i style="width:${n/7*100}%"></i></div><em>${n}/7</em></div>`}).join('')||'<p class="cnt" style="padding:0">Add a habit to see progress.</p>';
 return `<div class="tiles"><div class="tile"><b>${total}</b><span>Check-ins</span></div><div class="tile"><b>${best}</b><span>Best streak (days)</span></div><div class="tile"><b>${S.opened||0}</b><span>Cases opened</span></div><div class="tile"><b>${own.length}/${SK.length}</b><span>Skins collected</span></div></div><div class="pan"><h3>Last 14 days</h3><svg viewBox="0 0 336 124" width="100%" role="img" aria-label="Check-ins per day">${bars}</svg></div><div class="pan"><h3>This week by habit</h3>${hb}</div><div class="pan"><h3>Collection by rarity</h3><div class="stk">${stk}</div></div>`}
function burst(col){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;for(let i=0;i<30;i++){const e=document.createElement('i');e.className='cf';const a=Math.random()*6.28,r=90+Math.random()*130;e.style.cssText=`background:${i%3?col:'#fff'};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r-60}px`;$('od').append(e);setTimeout(()=>e.remove(),1300)}}
$('snd').onclick=()=>{S.snd=((S.snd||0)+1)%3;save();render();music();sfx('coin')};
addEventListener('pointerdown',ac,{once:true});
$('tn').onclick=()=>{if(ti<TUT.length-1){ti++;showTut()}else{$('tut').close()}};
$('tp').onclick=()=>{if(ti>0){ti--;showTut()}};
$('hp').onclick=openTut;
$('tut').addEventListener('close',()=>{if(!S.tut){S.tut=1;save()}});
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='nas-backup-'+day(0)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('main').addEventListener('change',e=>{if(e.target.id!='imp'||!e.target.files[0])return;e.target.files[0].text().then(t=>{try{const j=JSON.parse(t);if(!Array.isArray(j.habits)||!Array.isArray(j.owned)||typeof j.coins!='number')throw 0;j.cd=j.cd||{};S=j;save();render();toast('Backup restored')}catch(x){toast('Not a Nas backup')}})});
function openCase(id){
 if(busy)return;const c=CASES.find(x=>x.id==id);if(S.coins<c.p)return;
 const pl=pool(c),w=TW[c.t],pick=()=>{let r=Math.random()*pl.reduce((a,k)=>a+w[k[2]],0);for(const k of pl){r-=w[k[2]];if(r<0)return k}return pl[0]};
 let win=pick();if((S.pity||0)>=14&&win[2]!='epic'&&win[2]!='legendary'){const hi=pl.filter(k=>k[2]=='epic'||k[2]=='legendary');win=hi[Math.floor(Math.random()*hi.length)]}S.pity=win[2]=='epic'||win[2]=='legendary'?0:(S.pity||0)+1;S.coins-=c.p;S.opened=(S.opened||0)+1;const dupe=S.owned.includes(win[0]);
 if(dupe)S.coins+=DUPE[win[2]];else S.owned.push(win[0]);
 save();busy=true;
 $('rt').innerHTML=Array.from({length:42},(_,i)=>{const k=i==36?win:pick();return `<div class="card it" data-r="${k[2]}"><div class="pv" data-skin="${k[0]}">${PV}</div><small>${k[1]}</small></div>`}).join('');
 $('rt').style.transition='none';$('rt').style.transform='none';$('od').style.boxShadow='';$('res').innerHTML='';$('ot').textContent=c.e+' '+c.n;
 if(!$('od').open)$('od').showModal();
 $('coins').textContent='🪙 '+S.coins;void $('rt').offsetWidth;const rm=matchMedia('(prefers-reduced-motion:reduce)').matches,pre=rm?0:900;if(pre){$('ww').style.visibility='hidden';$('cs').hidden=false;$('cs').className='shake';$('cs').innerHTML=`<div style="width:170px;margin:0 auto">${crate(c,1)}</div>`;sfx('shake')}setTimeout(()=>{$('cs').hidden=true;$('ww').style.visibility='';
 const off=36*120+56-$('ww').clientWidth/2+(Math.random()*60-30);
 $('rt').style.transition=rm?'none':'transform 5s cubic-bezier(.1,.75,.12,1)';
 $('rt').style.transform=`translateX(${-off}px)`;if(!rm&&S.snd>0)for(let i=1;i<=34;i++)setTimeout(()=>sfx('tick'),5000*Math.pow(i/34,2.2));
 setTimeout(()=>{busy=false;if(dupe)bump();const hi=document.querySelector('#rt .it:nth-child(37)');if(hi)hi.classList.add('hit');sfx('win',win[2]);if(dupe)setTimeout(()=>sfx('dup'),700);navigator.vibrate&&navigator.vibrate([30,40,30]);if(win[2]=='epic'||win[2]=='legendary'){const cc=win[2]=='epic'?'#b86bff':'#ffb52e';burst(cc);$('od').style.boxShadow='0 0 90px -8px '+cc}
  $('res').innerHTML=`<div class="reveal card" data-r="${win[2]}"><div class="pv" data-skin="${win[0]}">${PV}</div><h3>${win[1]}</h3><p class="rar">${win[2]}</p><p>${dupe?'Duplicate. '+DUPE[win[2]]+' coins back.':'New skin unlocked.'}</p></div><div class="row"><button class="pri" data-eq="${win[0]}">Equip</button><button data-again="${c.id}" ${S.coins<c.p?'disabled':''}>Open again</button><button id="oc">Close</button></div>`;render()},rm?50:5100)},pre);
}
$('od').addEventListener('click',e=>{const q=e.target.closest('[data-eq]'),a=e.target.closest('[data-again]');
 if(q){S.skin=q.dataset.eq;save();render()}
 if(a)openCase(a.dataset.again);
 if(e.target.closest('#oc'))$('od').close()});
$('od').addEventListener('cancel',e=>{if(busy)e.preventDefault()});
function openDlg(h){editing=h||null;armed=false;emo=h?h.emo:EMO[0];
 $('dt').textContent=h?'Edit habit':'New habit';$('hn').value=h?h.name:'';$('ht').value=h?h.time:'';
 $('del').style.display=h?'':'none';$('del').textContent='Delete';drawEmo();$('dlg').showModal();$('hn').focus()}
function drawEmo(){$('emo').innerHTML=EMO.map(x=>`<button type="button" aria-pressed="${x==emo}" data-m="${x}">${x}</button>`).join('')}
$('emo').onclick=e=>{const m=e.target.closest('[data-m]');if(m){emo=m.dataset.m;drawEmo()}};
$('add').onclick=()=>openDlg();
$('cx').onclick=()=>$('dlg').close();
$('sv').onclick=()=>{const n=$('hn').value.trim();if(!n){$('hn').focus();return}
 if(editing)Object.assign(editing,{name:n,time:$('ht').value,emo});
 else S.habits.push({id:String(S.seq++),name:n,time:$('ht').value,emo,log:{}});
 save();$('dlg').close();render()};
$('del').onclick=()=>{if(!armed){armed=true;$('del').textContent='Tap again to delete';return}
 S.habits=S.habits.filter(h=>h!==editing);save();$('dlg').close();render()};
$('hn').addEventListener('keydown',e=>{if(e.key=='Enter')$('sv').click()});
function tick(){document.querySelectorAll('.tm').forEach(e=>{const l=e.dataset.t-Date.now();if(l<=0){e.textContent='Ready now';if(!document.querySelector('dialog[open]'))render()}else e.textContent='⏳ Ready in '+fmt(l)})}
setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
let dp=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('inst').hidden=false});
$('inst').onclick=()=>{if(dp){dp.prompt();dp=null;$('inst').hidden=true}};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();if(!S.tut)setTimeout(openTut,500);
</script>
